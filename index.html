<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menderes Belediyesi Başkanvekili Seçimi</title>
<style>
  :root{
    --cumhur:#EFA22B;
    --yeniparti:#0FA398;
    --chp:#E0233A;
    --bagimsiz:#8A93A3;
    --gecersiz:#C6CBD3;
    --ink:#171A21;
    --muted:#8A8F9A;
    --line:#ECEDF1;
    --card:#FCFCFD;
    --card-soft:#F5F6F8;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    padding:0;
    background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    overflow-x:hidden;
  }
  .card{
    width:100%;
    max-width:600px;
    margin:0 auto;
    background:linear-gradient(180deg,#FFFFFF 0%,var(--card) 100%);
    border:1px solid var(--line);
    border-radius:18px;
    box-shadow:0 1px 2px rgba(20,22,30,.03), 0 6px 20px rgba(20,22,30,.05);
    padding:26px 26px 20px;
  }
  .head{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:2px;
  }
  .head .accent{
    width:5px;
    height:20px;
    border-radius:3px;
    background:linear-gradient(180deg,var(--cumhur),var(--chp));
    flex:0 0 auto;
  }
  .title{
    font-size:16.5px;
    font-weight:700;
    letter-spacing:.1px;
    margin:0;
    line-height:1.25;
  }

  .tabs{
    display:flex;
    gap:6px;
    margin:16px 0 0 15px;
    border-bottom:1px solid var(--line);
  }
  .tab{
    appearance:none;
    border:none;
    background:none;
    font-family:inherit;
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    padding:8px 10px 9px;
    cursor:pointer;
    position:relative;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{
    color:var(--ink);
  }
  .tab.active::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:-1px;
    height:2px;
    border-radius:2px;
    background:linear-gradient(90deg,var(--cumhur),var(--chp));
  }

  .chart{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:12px;
    height:126px;
    margin:22px 6px 0;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
  }
  .col{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    height:100%;
    flex:1 1 0;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .col .count{
    font-size:16px;
    font-weight:800;
    line-height:1;
    margin-bottom:8px;
    color:var(--ink);
    transition:transform .15s ease;
  }
  .col .bar{
    width:34px;
    max-width:70%;
    border-radius:8px 8px 3px 3px;
    transition:filter .15s ease, transform .15s ease;
  }
  .col .bar.invalid{
    background-image:repeating-linear-gradient(45deg, #B7BCC5, #B7BCC5 4px, #D4D8DE 4px, #D4D8DE 8px);
  }
  .col .bar.abstain{
    background-image:repeating-linear-gradient(45deg, #D7C9A8, #D7C9A8 4px, #ECE3CE 4px, #ECE3CE 8px);
  }
  .col:hover .bar{
    filter:brightness(1.06);
  }
  .col.active .bar{
    transform:scaleX(1.08);
  }
  .col.active .count{
    transform:translateY(-2px);
  }
  .labels{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin:9px 6px 0;
  }
  .labels .lbl{
    flex:1 1 0;
    text-align:center;
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    letter-spacing:.1px;
    line-height:1.3;
  }
  .labels .lbl .party{
    display:block;
    font-size:9.5px;
    font-weight:500;
    color:var(--muted);
    opacity:.8;
    margin-top:1px;
  }
  .info-box{
    margin:16px 0 0;
    padding:11px 14px;
    background:var(--card-soft);
    border-radius:11px;
    font-size:12.5px;
    text-align:center;
    color:var(--ink);
    border-left:3px solid transparent;
    transition:border-color .15s ease;
  }
  .info-box.empty{
    color:var(--muted);
  }
  .info-box .cand-name{
    font-weight:800;
  }
  .info-box .cand-party{
    color:var(--muted);
  }
  .foot{
    text-align:center;
    font-size:10.5px;
    color:var(--muted);
    margin:16px 0 0;
    line-height:1.4;
  }
  @media (max-width:400px){
    .card{padding:20px 16px 16px;}
    .chart{gap:6px;height:110px;margin-top:18px;}
    .col .bar{width:24px;}
    .col .count{font-size:14px;}
    .labels .lbl{font-size:9.5px;}
    .labels .lbl .party{font-size:8px;}
    .labels{gap:6px;}
    .tabs{margin-left:0;}
    .tab{padding:8px 7px 9px;}
  }
</style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="accent"></span>
      <p class="title">Menderes Belediyesi Başkanvekili Seçimi Oylama</p>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab active" data-round="3">3. Tur</button>
      <button class="tab" data-round="2">2. Tur</button>
      <button class="tab" data-round="1">1. Tur</button>
    </div>

    <div class="chart" id="chart"></div>
    <div class="labels" id="labels"></div>

    <div class="info-box empty" id="infoBox">Bilgi görmek için bir sütuna dokunun</div>

    <p class="foot" id="foot"></p>
  </div>

  <script>
    var ROUNDS = {
      1: {
        foot: "Menderes Belediyesi Başkanvekili seçimi 1. tur oylama sonucu",
        items: [
          {name:"Asuman Şen", party:"Cumhur İttifakı", count:12, color:"var(--cumhur)"},
          {name:"Barış Gürsoy", party:"Yeni Parti", count:10, color:"var(--yeniparti)"},
          {name:"Mehmet Ali Akar", party:"CHP", count:5, color:"var(--chp)"},
          {name:"Mustafa Öztürk", party:"Bağımsız", count:1, color:"var(--bagimsiz)"}
        ]
      },
      2: {
        foot: "Menderes Belediyesi Başkanvekili seçimi 2. tur oylama sonucu",
        items: [
          {name:"Asuman Şen", party:"Cumhur İttifakı", count:10, color:"var(--cumhur)"},
          {name:"Barış Gürsoy", party:"Yeni Parti", count:9, color:"var(--yeniparti)"},
          {name:"Mehmet Ali Akar", party:"CHP", count:5, color:"var(--chp)"},
          {name:"Mustafa Öztürk", party:"Bağımsız", count:1, color:"var(--bagimsiz)"},
          {name:"Geçersiz Oy", party:"", count:3, color:"var(--gecersiz)", invalid:true}
        ]
      },
      3: {
        foot: "Menderes Belediyesi Başkanvekili seçimi 3. tur oylama sonucu",
        items: [
          {name:"Asuman Şen", party:"Cumhur İttifakı", count:13, color:"var(--cumhur)"},
          {name:"Barış Gürsoy", party:"Yeni Parti", count:10, color:"var(--yeniparti)"},
          {name:"Oy Kullanmayan", party:"", count:5, color:"#C9A66B", abstain:true}
        ]
      }
    };

    var MAX_BAR_HEIGHT = 96;

    var chartEl = document.getElementById('chart');
    var labelsEl = document.getElementById('labels');
    var infoBox = document.getElementById('infoBox');
    var footEl = document.getElementById('foot');
    var tabs = document.querySelectorAll('.tab');

    function resetInfoBox(){
      infoBox.classList.add('empty');
      infoBox.style.borderLeftColor = 'transparent';
      infoBox.innerHTML = 'Bilgi görmek için bir sütuna dokunun';
    }

    function renderRound(roundKey){
      var round = ROUNDS[roundKey];
      var maxCount = Math.max.apply(null, round.items.map(function(i){ return i.count; }));

      chartEl.innerHTML = '';
      labelsEl.innerHTML = '';

      round.items.forEach(function(item){
        var h = Math.max(6, Math.round((item.count / maxCount) * MAX_BAR_HEIGHT));

        var col = document.createElement('div');
        col.className = 'col';
        col.setAttribute('data-name', item.name);
        col.setAttribute('data-party', item.party);
        col.setAttribute('data-count', item.count);
        col.setAttribute('data-color', item.color);

        var count = document.createElement('span');
        count.className = 'count';
        count.textContent = item.count;

        var bar = document.createElement('div');
        bar.className = 'bar' + (item.invalid ? ' invalid' : '') + (item.abstain ? ' abstain' : '');
        bar.style.height = h + 'px';
        if(!item.invalid && !item.abstain){ bar.style.background = item.color; }

        col.appendChild(count);
        col.appendChild(bar);
        chartEl.appendChild(col);

        var lbl = document.createElement('span');
        lbl.className = 'lbl';
        lbl.textContent = item.name;
        if(item.party){
          var p = document.createElement('span');
          p.className = 'party';
          p.textContent = item.party;
          lbl.appendChild(p);
        }
        labelsEl.appendChild(lbl);

        col.addEventListener('click', function(){
          document.querySelectorAll('#chart .col').forEach(function(c){ c.classList.remove('active'); });
          col.classList.add('active');
          infoBox.classList.remove('empty');
          infoBox.style.borderLeftColor = item.color;
          infoBox.innerHTML =
            '<span class="cand-name" style="color:' + item.color + '">' + item.name + '</span>' +
            (item.party ? ' <span class="cand-party">(' + item.party + ')</span>' : '') +
            ' — ' + item.count + ' oy';
        });
      });

      footEl.textContent = round.foot;
      resetInfoBox();
    }

    tabs.forEach(function(tab){
      tab.addEventListener('click', function(){
        tabs.forEach(function(t){ t.classList.remove('active'); });
        tab.classList.add('active');
        renderRound(tab.getAttribute('data-round'));
      });
    });

    renderRound(3);
  </script>
</body>
</html>
